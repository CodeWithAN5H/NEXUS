name: nexus
description: "NEXUS — premium cross-platform anime discovery and streaming."
publish_to: "none"
version: 0.2.0-alpha.2+3

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0

  # Routing
  go_router: ^18.1.4

  # Networking
  dio: ^5.11.1

  # Local persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Provider credentials (Android Keystore / platform keystore). Decision D4.
  flutter_secure_storage: ^10.0.0

  # Video playback
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Presentation utilities
  cached_network_image: ^4.0.7
  intl: ^0.20.3
  collection: ^1.19.1
  url_launcher: ^6.3.3
  screen_brightness: ^2.1.11
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  # 2.17.1 requires build 5.0.0, which is missing the AssetId extension that
  # version references (upstream packaging break). 2.16.2 + build 4.x generates
  # the Drift code correctly; this is dev tooling only.
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
